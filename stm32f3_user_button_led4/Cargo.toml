[package]
name = "stm32f3_user_button_led4"
version = "0.1.0"
edition = "2021"

[dependencies]
cortex-m = "0.7.7"
cortex-m-rt = "0.7.3"
panic-halt = "1.0.0"

[dependencies.stm32f3xx-hal]
version = "0.10.0"
features = ["stm32f303xc", "rt"]

[profile.dev]
codegen-units = 1
debug = 2
opt-level = 1

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"
